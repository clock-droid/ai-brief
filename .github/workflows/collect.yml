name: 수집

# 정기 수집은 글쓰기 예약 작업이 시작할 때 직접 한다 (WRITING.md 1절).
# GitHub 예약 실행은 첫날 3시간 반 동안 한 번도 돌지 않아 쓰지 않는다. 수동 실행용으로만 남김.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 후보 수집
        run: python collector/collect.py

      - name: 커밋·푸시
        run: |
          git config user.name "ai-brief-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새 후보 없음"
            exit 0
          fi
          git commit -m "수집: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
